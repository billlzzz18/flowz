[package]
name = "flowz-mcp"
version = "0.1.0"
edition = "2024"
description = "Rust MCP server for workflow orchestration with pmcp"
license = "MIT OR Apache-2.0"
# tests/ holds only worker stub binaries ([[bin]] below); no integration tests
autotests = false

[dependencies]
sbx-core = { path = "crates/sbx-core" }
pmcp = { version = "2.9", features = ["macros", "schema-generation", "validation", "full"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
schemars = { version = "0.8", features = ["derive", "chrono"] }
thiserror = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
cron-crate = { package = "cron", version = "0.9" }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
async-trait = "0.1"
serde_repr = "0.1"
notify-rust = "4"
which = "6"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
guardian = { path = "crates/guardian" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[bin]]
name = "flowz-mcp"
path = "src/main.rs"

[lib]
name = "flowz"
path = "src/lib.rs"

[[bin]]
name = "worker"
path = "tests/worker-test.rs"

[[bin]]
name = "test_spawn"
path = "tests/test_bin/test_spawn.rs"

[[bin]]
name = "test_spawn2"
path = "tests/test_bin/test_spawn2.rs"

[[test]]
name = "test_flowz_langfuse_logging"
path = "tests/test_flowz_langfuse_logging.rs"
required-features = ["testing"]

[[test]]
name = "test_engine_tracing"
path = "tests/test_engine_tracing.rs"
required-features = ["testing"]

[[test]]
name = "test_prompt_fetcher"
path = "tests/test_prompt_fetcher.rs"
required-features = ["testing"]

[[test]]
name = "test_workflow_compose_prompt"
path = "tests/test_workflow_compose_prompt.rs"
required-features = ["testing"]

[workspace]
members = [
    ".",
    "crates/guardian",
    "crates/sbx-core",
    "crates/sbx",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = []
testing = []
