[package]
name = "guardian"
version = "0.1.0"
edition = "2021"
description = "AI code quality guardian - detect slop, over-engineering, and AI behavior patterns"
repository = "https://github.com/bl1nk-bot/guardian"
license = "MIT OR Apache-2.0"
categories = ["development-tools", "code-analysis"]
keywords = ["ai", "code-quality", "linting", "static-analysis"]

[lib]
name = "guardian"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "guardian"
path = "src/bin/guardian.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = []
python = ["pyo3"]
python-abi3 = ["pyo3/abi3"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
pyo3 = { version = "0.22", optional = true, features = ["extension-module"] }
once_cell = "1"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
ast-grep = "0.45"
ast-grep-core = "0.45"
ast-grep-language = "0.45"
walkdir = "2"
tempfile = "3"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }